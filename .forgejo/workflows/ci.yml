name: ci
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: host
    steps:
      - name: Checkout
        run: |
          set -e
          rm -rf src && mkdir src && cd src
          git clone --depth 1 "http://rotting-ci:$(cat /etc/gitea-runner/rr-token)@10.50.0.6:3000/marshalmiller/rottingresearch.git" .
      - name: Build venv (pin-workaround set)
        run: |
          set -e
          cd src
          python3 -m venv venv
          PY=venv/bin/pip
          $PY install -q --upgrade pip
          $PY install -q "pymupdf==1.25.5" "chardet==5.2.0" "lxml==5.3.2" "requests==2.34.2" "Flask==3.1.3" "Werkzeug==3.1.8" "gunicorn==26.2.0" "redis==8.1.0" "celery==5.6.3" "google-cloud-recaptcha-enterprise==1.33.0"
          $PY install -q --no-deps "linkrot==5.0"
          $PY install -q pytest pytest-flask pytest-cov pytest-mock
      - name: Unit tests
        run: |
          cd src
          REDIS_URL=redis://localhost:6379 APP_SECRET_KEY=dummy ENV=DEV venv/bin/python -m pytest tests/unit -q
      - name: App import smoke
        run: |
          cd src
          REDIS_URL=redis://localhost:6379 APP_SECRET_KEY=dummy ENV=DEV venv/bin/python -c "import app; print('app-import-OK routes:', len(list(app.app.url_map.iter_rules())))"